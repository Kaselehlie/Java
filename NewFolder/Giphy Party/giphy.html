    <main>

      <h1> Project Giphy Party</h1> <img src="https://www.alwaysonpurpose.com/wp-content/uploads/2019/11/happypeople-1024x679.jpg">

     <!-- Form for searching GIFs -->
        <div> 
<form id="search-form"> <!-- Added an ID for easier JavaScript access -->

        
  <input type="text" 
  required 
        id="search-input" 
        placeholder="Search for GIFs"> <!--please fill in field command-->

  <button id="search-submit" 
   type="submit">Search</button><!--Search box -->
  
  <button id="delete-gifs"
   type="button">Reset Search</button>
    <!--Delete button -->
        
  </form>
<!-- Container for displaying search results -->
        <div id="results-container"></div>

        <!-- form to search random gifs-->
         <form id="random-form"> 

<!--Random GIF button -->          
  <button id="random-submit" 
   type="submit">Random GIF</button>
  

   <!--Delete button for random gifs -->
   <button id="delete-random-gifs"
   type="button">Reset Random</button> 
  </form>  
 
             
 </main>
